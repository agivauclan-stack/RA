<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réalité Augmentée - Bouteille</title>
  <!-- Script officiel du lecteur 3D de Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; overflow: hidden; }
    model-viewer { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <!-- Lecteur WebAR universel -->
  <model-viewer 
    src="https://raw.githubusercontent.com/agivauclan-stack/RA/main/bouteille.glb"
    ios-src="bouteille.usdz"
    alt="Bouteille d'eau scannée"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate>
  </model-viewer>

</body>
</html>
